<div class="row">
	<div class="col-12">
		<h2 class="mb-4">
			<i class="bi bi-code-square me-2"></i>
			<span id="pageTitle">Sandbox</span>
		</h2>
	</div>
</div>

<div class="row">
	<div class="col-md-4">
		<div class="card">
			<div class="card-header d-flex justify-content-between align-items-center">
				<span><i class="bi bi-folder me-2"></i>Files</span>
				<button class="btn btn-sm btn-success" onclick="createNewFile()">
					<i class="bi bi-plus-circle"></i> New
				</button>
			</div>
			<div class="card-body p-0">
				<div id="filesList" class="list-group list-group-flush">
					<div class="text-center p-4">
						<div class="spinner-border text-primary" role="status">
							<span class="visually-hidden">Loading...</span>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<div class="col-md-8">
		<div class="card">
			<div class="card-header d-flex justify-content-between align-items-center">
				<span>
					<i class="bi bi-code-square me-2"></i>
					<span id="currentFileName">Select a file</span>
				</span>
				<div class="btn-group">
					<button class="btn btn-sm btn-primary" onclick="saveFile()" id="saveBtn" disabled>
						<i class="bi bi-save"></i> Save
					</button>
					<button class="btn btn-sm btn-danger" onclick="deleteFile()" id="deleteBtn" disabled>
						<i class="bi bi-trash"></i> Delete
					</button>
				</div>
			</div>
			<div class="card-body">
				<div id="editorContainer">
					<div class="alert alert-info">
						<i class="bi bi-info-circle me-2"></i>
						Select a file from the list to edit, or create a new one.
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
