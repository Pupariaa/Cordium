<div class="row">
	<div class="col-12">
		<h2 class="mb-4">
			<i class="bi bi-hash me-2"></i>
			Channels
		</h2>
	</div>
</div>

<div class="row mb-4">
	<div class="col-md-3">
		<div class="card shadow-sm">
			<div class="card-body">
				<h6 class="card-title mb-2">
					<i class="bi bi-hash me-2 text-primary"></i>
					Text Channels
				</h6>
				<h3 class="mb-0" id="textChannelCount">--</h3>
			</div>
		</div>
	</div>
	<div class="col-md-3">
		<div class="card shadow-sm">
			<div class="card-body">
				<h6 class="card-title mb-2">
					<i class="bi bi-volume-up me-2 text-success"></i>
					Voice Channels
				</h6>
				<h3 class="mb-0" id="voiceChannelCount">--</h3>
			</div>
		</div>
	</div>
	<div class="col-md-3">
		<div class="card shadow-sm">
			<div class="card-body">
				<h6 class="card-title mb-2">
					<i class="bi bi-folder me-2 text-warning"></i>
					Categories
				</h6>
				<h3 class="mb-0" id="categoryCount">--</h3>
			</div>
		</div>
	</div>
	<div class="col-md-3">
		<div class="card shadow-sm">
			<div class="card-body">
				<h6 class="card-title mb-2">
					<i class="bi bi-chat-square-text me-2 text-info"></i>
					Forum Channels
				</h6>
				<h3 class="mb-0" id="forumChannelCount">--</h3>
			</div>
		</div>
	</div>
</div>

<div class="row">
	<div class="col-12">
		<div class="card">
			<div class="card-header d-flex justify-content-between align-items-center">
				<span><i class="bi bi-hash me-2"></i>All Channels</span>
			</div>
			<div class="card-body p-0">
			<div class="list-group list-group-flush" id="channelsList">
				<div class="text-center p-4">
					<div class="cordium-spinner spinner-sm">
						<img src="logo-base.png" alt="Loading" class="cordium-spinner-base">
						<img src="logo-arrow.png" alt="Loading" class="cordium-spinner-arrow">
					</div>
				</div>
			</div>
			</div>
		</div>
	</div>
</div>
