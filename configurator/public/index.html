<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title id="pageTitle">Cordium</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
	<link href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css" rel="stylesheet">
	<link href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/dracula.min.css" rel="stylesheet">
	<link href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/elegant.min.css" rel="stylesheet">
	<link href="style.css" rel="stylesheet">
</head>

<body>
	<div class="loading-overlay" id="loadingOverlay"></div>
	<div class="loading-spinner">
		<div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
			<span class="visually-hidden">Loading...</span>
		</div>
	</div>

	<div id="setupWizard" style="display: none;">
	</div>

	<div id="dashboard" style="display: none;">
		<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
			<div class="container-fluid">
				<a class="navbar-brand fw-bold" href="#" onclick="loadPage('server')">
					<i class="bi bi-lightning-charge-fill me-2 text-warning"></i>
					<span class="text-gradient">Cordium Manager</span>
				</a>
				<div class="d-flex align-items-center">
					<span class="status-badge bg-success me-3">
						<i class="bi bi-circle-fill me-1"></i>
						<span>Connected</span>
					</span>
					<button class="btn btn-outline-light btn-sm" id="themeToggle">
						<i class="bi bi-sun-fill" id="themeIcon"></i>
					</button>
				</div>
			</div>
		</nav>

		<div class="container-fluid">
			<div class="row">
				<nav class="col-md-2 d-md-block bg-body-tertiary sidebar">
					<div class="position-sticky pt-3">
						<ul class="nav flex-column">
							<li class="nav-item">
								<a class="nav-link active" href="#" data-page="server">
									<i class="bi bi-speedometer2 me-2"></i>
									Dashboard
								</a>
							</li>
							<li class="nav-item">
								<a class="nav-link" href="#" data-page="commands">
									<i class="bi bi-command me-2"></i>
									Commands
								</a>
							</li>
							<li class="nav-item">
								<a class="nav-link" href="#" data-page="events">
									<i class="bi bi-calendar-event me-2"></i>
									Events
								</a>
							</li>
							<li class="nav-item">
								<a class="nav-link" href="#" data-page="endpoints">
									<i class="bi bi-plugin me-2"></i>
									Endpoints
								</a>
							</li>
							<li class="nav-item">
								<a class="nav-link" href="#" data-page="sandbox">
									<i class="bi bi-code-square me-2"></i>
									Sandbox
								</a>
							</li>
							<li class="nav-item mt-3 pt-3 border-top">
								<a class="nav-link" href="#" data-page="config">
									<i class="bi bi-gear me-2"></i>
									Settings
								</a>
							</li>
						</ul>
					</div>
				</nav>

				<main class="col-md-10 ms-sm-auto px-md-4">
					<div class="py-4" id="content">
					</div>
				</main>
			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/javascript/javascript.min.js"></script>
	<script src="app.js"></script>
</body>

</html>
