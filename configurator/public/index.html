<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title id="pageTitle">Cordium</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
	<link href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css" rel="stylesheet">
	<link href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/dracula.min.css" rel="stylesheet">
	<link href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/elegant.min.css" rel="stylesheet">
	<link href="style.css" rel="stylesheet">
</head>

<body>
	<div class="loading-overlay" id="loadingOverlay"></div>
	<div class="loading-spinner">
		<div class="cordium-spinner">
			<img src="logo-base.png" alt="Loading" class="cordium-spinner-base">
			<img src="logo-arrow.png" alt="Loading" class="cordium-spinner-arrow">
		</div>
		<div class="loading-message mt-3">Loading...</div>
	</div>

	<div id="setupWizard" style="display: none;">
	</div>

	<div id="dashboard" style="display: none;">
		<nav class="navbar navbar-expand-lg navbar-dark">
			<div class="container-fluid">
				<a class="navbar-brand fw-bold d-flex align-items-center" href="#" onclick="loadPage('server')">
					<img src="cordium-1000x700.png" alt="Cordium" class="navbar-logo">
					<div class="brand-text ms-2">
						<div class="brand-title">Cordium Manager</div>
						<div class="brand-subtitle">Control Panel</div>
					</div>
				</a>
				<div class="d-flex align-items-center gap-3">
					<div class="navbar-stats d-none d-lg-flex align-items-center gap-3">
						<div class="stat-item">
							<i class="bi bi-cpu"></i>
							<span class="stat-label">CPU</span>
							<span class="stat-value" id="cpuUsage">--</span>
						</div>
						<div class="stat-item">
							<i class="bi bi-memory"></i>
							<span class="stat-label">RAM</span>
							<span class="stat-value" id="ramUsage">--</span>
						</div>
						<div class="stat-item">
							<i class="bi bi-clock"></i>
							<span class="stat-label">Uptime</span>
							<span class="stat-value" id="uptimeDisplay">--</span>
						</div>
					</div>
					<div class="navbar-divider d-none d-lg-block"></div>
					<span class="status-badge bg-success">
						<i class="bi bi-circle-fill"></i>
						<span class="status-text">Connected</span>
					</span>
					<button class="btn btn-theme" id="themeToggle" title="Toggle theme">
						<i class="bi bi-sun-fill" id="themeIcon"></i>
					</button>
				</div>
			</div>
		</nav>

		<div class="container-fluid">
			<div class="row">
				<nav class="col-md-2 d-md-block bg-body-tertiary sidebar">
					<div class="position-sticky pt-3">
						<ul class="nav flex-column">
							<li class="nav-item">
								<a class="nav-link active" href="#" data-page="server">
									<i class="bi bi-speedometer2 me-2"></i>
									Dashboard
								</a>
							</li>
							<li class="nav-item">
								<a class="nav-link" href="#" data-page="channels">
									<i class="bi bi-hash me-2"></i>
									Channels
								</a>
							</li>
							<li class="nav-item">
								<a class="nav-link" href="#" data-page="roles">
									<i class="bi bi-shield me-2"></i>
									Roles
								</a>
							</li>
							<li class="nav-item">
								<a class="nav-link" href="#" data-page="members">
									<i class="bi bi-people me-2"></i>
									Members
								</a>
							</li>
							<li class="nav-item">
								<a class="nav-link" href="#" data-page="messages">
									<i class="bi bi-chat-dots me-2"></i>
									Messages
								</a>
							</li>
							<li class="nav-item mt-3 pt-3 border-top">
								<a class="nav-link" href="#" data-page="commands">
									<i class="bi bi-command me-2"></i>
									Commands
								</a>
							</li>
							<li class="nav-item">
								<a class="nav-link" href="#" data-page="events">
									<i class="bi bi-calendar-event me-2"></i>
									Events
								</a>
							</li>
							<li class="nav-item">
								<a class="nav-link" href="#" data-page="endpoints">
									<i class="bi bi-plugin me-2"></i>
									Endpoints
								</a>
							</li>
							<li class="nav-item">
								<a class="nav-link" href="#" data-page="sandbox">
									<i class="bi bi-code-square me-2"></i>
									Sandbox
								</a>
							</li>
							<li class="nav-item mt-3 pt-3 border-top">
								<a class="nav-link" href="#" data-page="config">
									<i class="bi bi-gear me-2"></i>
									Settings
								</a>
							</li>
						</ul>
					</div>
				</nav>

				<main class="col-md-10 ms-sm-auto px-md-4">
					<div class="py-4" id="content">
					</div>
				</main>
			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/javascript/javascript.min.js"></script>
	<script src="app.js"></script>
</body>

</html>
